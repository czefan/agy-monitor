name: Release Plugin Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version label (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, build, and test
        run: pnpm check
      - name: Package plugin archive
        id: pkg
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          ARCHIVE="agy-monitor-${TAG}.zip"
          rm -rf release-stage
          mkdir -p release-stage
          cp -r dist release-stage/agy-monitor
          (cd release-stage && zip -r "../${ARCHIVE}" agy-monitor)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          files: ${{ steps.pkg.outputs.archive }}
          generate_release_notes: true
